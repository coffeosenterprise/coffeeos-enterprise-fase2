services:
  - type: web
    name: coffeeos-enterprise
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_ADMIN_USER
        sync: false
      - key: DB_ADMIN_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: APP_DB_ROLE_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: in-v3.mailjet.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
